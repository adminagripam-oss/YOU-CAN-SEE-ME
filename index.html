<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriFace - Sistem Absensi Biometrik Wajah Perkebunan (1-to-1 Engine)</title>

  <!-- PWA Service Worker (Dengan Aturan Bypass Cache *.supabase.co) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').then(function (reg) {
          console.log('[PWA SW] Service Worker registered with scope:', reg.scope);
        }).catch(function (err) {
          console.warn('[PWA SW] Service Worker registration failed:', err);
        });
      });
    }
  </script>

  <!-- PWA Setup -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ffffff">
  <link rel="apple-touch-icon" href="/logo.png">
  <meta name="apple-mobile-web-app-title" content="AgriFace">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="application-name" content="AgriFace">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- FontAwesome Icons -->
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">



  <!-- @vladmandic/human: dimuat LANGSUNG secara dinamis di humanSingleton.js (bukan di-bundle Vite) -->

  <!-- Developer Console Virtual (Eruda) untuk debugging langsung di layar HP/Tablet -->
  <script src="/eruda.js"></script>
  <script>eruda.init();</script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
