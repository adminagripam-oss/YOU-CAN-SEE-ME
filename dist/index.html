  <title>AgriFace - Sistem Absensi Biometrik Wajah Perkebunan (1-to-1 Engine)</title>

  <!-- Script untuk membersihkan PWA Service Worker otomatis -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (let registration of registrations) {
          registration.unregister();
          console.log('ServiceWorker unregistered automatically to clear cache.');
        }
      });
    }
  </script>

  <!-- PWA Setup -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ffffff">
  <link rel="apple-touch-icon" href="/logo.png">
  <meta name="apple-mobile-web-app-title" content="AgriFace">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="application-name" content="AgriFace">
