<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      function adjustViewport() {
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.screen.width < 768;
        const meta = document.getElementById('viewport') || document.querySelector('meta[name="viewport"]');
        if (meta) {
          if (isMobile) {
            // Force desktop layout (width 1100px) and scale it down on mobile screens
            meta.setAttribute('content', 'width=1100, initial-scale=0.35, minimum-scale=0.2, maximum-scale=3.0, user-scalable=yes');
          } else {
            meta.setAttribute('content', 'width=device-width, initial-scale=1.0');
          }
        }
      }
      adjustViewport();
      window.addEventListener('resize', adjustViewport);
    })();
  </script>
  <title>AgriFace - Sistem Absensi Biometrik Wajah Perkebunan (1-to-1 Engine)</title>

  <!-- Script untuk membersihkan PWA Service Worker otomatis -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (let registration of registrations) {
          registration.unregister();
          console.log('ServiceWorker unregistered automatically to clear cache.');
        }
      });
    }
  </script>
